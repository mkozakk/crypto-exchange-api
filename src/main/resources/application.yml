spring:
  application:
    name: crypto-exchange-api

  datasource:
    url: jdbc:mysql://localhost:3306/crypto_exchange?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

simulation:
  enabled: true
  tick-ms: 500

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
